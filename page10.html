<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الصفحة 10 - ذكرياتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%); margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        h2 { color: #d9534f; margin-bottom: 30px; font-size: 2.2em; }
        .gallery { display: flex; flex-direction: column; gap: 30px; max-width: 600px; width: 100%; }
        .card { background: rgba(255, 255, 255, 0.95); padding: 15px; border-radius: 25px; box-shadow: 0 10px 25px rgba(200, 100, 80, 0.15); border: 2px solid #fff5eb; }
        .card img, .card video { width: 100%; border-radius: 15px; max-height: 450px; object-fit: cover; outline: none; }
        .caption { margin-top: 15px; font-size: 1.25em; text-align: center; color: #444; font-weight: bold; line-height: 1.7; }
        .buttons { display: flex; gap: 15px; margin-top: 40px; margin-bottom: 20px; }
        .btn { padding: 12px 35px; background-color: #ff7e67; color: white; text-decoration: none; border-radius: 30px; font-weight: bold; font-size: 1.2em; box-shadow: 0 6px 20px rgba(255, 126, 103, 0.4); transition: transform 0.3s ease, background 0.3s ease; }
        .btn:hover { background-color: #e66b55; transform: translateY(-4px); }
        .btn-back { background-color: #7b7b7b; box-shadow: 0 6px 20px rgba(123, 123, 123, 0.4); }
        .btn-back:hover { background-color: #5a5a5a; }
    </style>
</head>
<body>
    <h2>الصفحة 10 (الأخيرة) 🌻</h2>
    <div class="gallery">

            <img src="IMG-20260811-WA0022.jpg" alt="صورة 19">

        </div>
        <div class="card">

        </div>
    </div>
    <div class="buttons">
        <a href="page9.html" class="btn btn-back">⬅️ السابق</a>
        <a href="page1.html" class="btn">العودة للبداية 🏠</a>
    </div>
</body>
</html>
