    <!-- ده الجزء اللي بيقرا ملف الأغنية وبيخليها تعيد نفسها (loop) -->
    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mp3">
    </audio>

    <!-- وده سطر الجافا سكريبت اللي بيخلي الأغنية تشتغل أول ما تدوس على الزرار -->
    <script>
        function startExperience() {
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('bg-music').play(); /* السطر ده اللي بيشغل الأغنية */
            document.getElementById('content-frame').src = 'welcome.html';
        }
    </script>
