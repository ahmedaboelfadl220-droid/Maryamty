<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة ذكرياتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Cairo', sans-serif; background: #0f172a; }
        
        /* شاشة البداية */
        #start-screen { 
            position: absolute; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            display: flex; 
            flex-direction: column; 
            justify-content: center; 
            align-items: center; 
            z-index: 9999; 
            cursor: pointer; 
            text-align: center; 
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
        }
        
        h1 { color: #f472b6; font-size: 2em; margin-bottom: 20px; }
        
        p { 
            color: #cbd5e1; 
            font-size: 1.5em; 
            font-weight: bold; 
            padding: 0 20px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.6; }
            100% { opacity: 1; }
        }

        #main-content { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="start-screen" onclick="startMagic()">
        <div style="font-size: 4em; margin-bottom: 20px;">✨</div>
        <h1>ناقص خطوة بسيطة ونبدأ..</h1>
        <p>دوسي يابت في ايي حته خلصينا بقى 👆</p>
    </div>

    <iframe id="main-content" src="start.html" name="contentFrame"></iframe>

    <script>
        function startMagic() {
            var music = document.getElementById('bg-music');
            music.play();
            document.getElementById('start-screen').style.display = 'none';
            document.getElementById('main-content').style.display = 'block';
        }
    </script>

</body>
</html>
