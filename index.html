<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>رحلة ذكرياتنا</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { 
            margin: 0; 
            padding: 0; 
            height: 100%; 
            overflow: hidden; /* عشان نمنع السكرول المزدوج */
            font-family: 'Cairo', sans-serif; 
            background: linear-gradient(135deg, #ffecd2 0%, #fcb69f 100%);
            display: flex; 
            flex-direction: column;
        }
        /* تصميم شريط الصوت الثابت فوق */
        .music-bar {
            background: rgba(255, 255, 255, 0.6);
            backdrop-filter: blur(10px);
            padding: 10px;
            display: flex;
            justify-content: center;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
            z-index: 100;
        }
        audio {
            width: 100%;
            max-width: 400px;
            outline: none;
            border-radius: 20px;
        }
        /* البرواز اللي هيعرض الصفحات */
        .content-frame {
            flex-grow: 1;
            border: none;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>

    <!-- شريط الأغنية اللي هيفضل شغال طول الوقت -->
    <div class="music-bar">
        <audio controls loop>
            <source src="song.mp3" type="audio/mpeg">
            متصفحك لا يدعم تشغيل الصوت.
        </audio>
    </div>

    <!-- البرواز اللي هيعرض بداية الرحلة -->
    <iframe class="content-frame" src="start.html" name="memoryFrame"></iframe>

</body>
</html>
