<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أسرار مريمتي 🔐</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    <style>
        body, html { margin: 0; padding: 0; height: 100%; overflow: hidden; font-family: 'Cairo', sans-serif; background: #0f172a; }
        
        #login-screen { 
            position: absolute; top: 0; left: 0; width: 100%; height: 100%; 
            display: flex; flex-direction: column; justify-content: center; 
            align-items: center; z-index: 9999; background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%); 
        }
        
        input { 
            padding: 15px; border-radius: 25px; border: none; width: 250px; 
            text-align: center; font-size: 1.2em; margin-bottom: 20px; outline: none;
        }
        
        button { 
            padding: 12px 35px; border-radius: 25px; border: none; background: #f472b6; 
            color: white; font-weight: bold; font-size: 1.1em; cursor: pointer; 
            transition: transform 0.2s;
        }
        button:hover { transform: scale(1.05); }

        #main-content { width: 100%; height: 100%; border: none; display: none; }
    </style>
</head>
<body>

    <audio id="bg-music" loop>
        <source src="song.mp3" type="audio/mpeg">
    </audio>

    <div id="login-screen">
        <h1 style="color: #f472b6; margin-bottom: 25px;">أدخلي الباسورد يا مريمتي 🔐</h1>
        <input type="text" id="passInput" placeholder="تاريخ ميلادك (يوم/شهر/سنة)">
        <button onclick="checkPass()">دوسي يا سوكه 🚀</button>
        <p id="errorMsg" style="color: #fb7185; display: none; margin-top: 15px;">الباسورد غلط يابت! حاولي تاني 🙊</p>
    </div>

    <iframe id="main-content" src="start.html" name="contentFrame"></iframe>

    <script>
        function checkPass() {
            var pass = document.getElementById('passInput').value;
            if(pass === "20/8/2006") { 
                document.getElementById('bg-music.play();
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>

</body>
</html>
